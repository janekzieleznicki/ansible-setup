---
- name: Verify smoke
  hosts: all
  gather_facts: true
  vars:
    core_packages:
      - python3
      - sudo
      - curl
      - tar
    family_extra:
      RedHat: [dnf]
      Suse: [zypper]
      Debian: [apt]
    expected_packages: "{{ core_packages + family_extra[ansible_facts['os_family']] | default([]) }}"
  tasks:
    - name: Probe package presence in the base image
      ansible.builtin.command: >
        {%- if item == 'python3' %}
        command -v python3
        {%- elif ansible_facts.pkg_mgr == 'apt' %}
        dpkg -s {{ item }}
        {%- elif ansible_facts.pkg_mgr in ['dnf', 'yum', 'dnf5'] %}
        rpm -q --whatprovides {{ item }}
        {%- elif ansible_facts.pkg_mgr == 'zypper' %}
        rpm -q --whatprovides {{ item }}
        {%- else %}
        echo "Unsupported package manager: {{ ansible_facts.pkg_mgr }}" && exit 1
        {%- endif %}
      register: pkg_check
      changed_when: false
      failed_when: false
      loop: "{{ expected_packages }}"
      loop_control:
        label: "{{ item }}"

    - name: Assert core packages are present in the base image
      ansible.builtin.assert:
        that:
          - item.rc == 0
      loop: "{{ pkg_check.results }}"
      loop_control:
        label: "{{ item.item }}"
      ansible.builtin.assert:
        that:
          - ansible_facts.pkg_mgr in ['dnf', 'dnf5', 'yum', 'zypper', 'apt']
          - ansible_facts.pkg_mgr is defined