---
dependency:
  name: galaxy
driver:
  name: podman
platforms:
  - name: fedora-newest
    image: quay.io/fedora/fedora-bootc:latest
    pre_build_image: true
    privileged: true
    command: /sbin/init
    ansible_user: root

  - name: rhel8
    image: quay.io/rockylinux/rockylinux:8-init
    pre_build_image: true
    privileged: true
    command: /sbin/init

  - name: rocky
    image: quay.io/rockylinux/rockylinux:9-init
    pre_build_image: true
    privileged: true
    command: /sbin/init

  - name: alma
    image: quay.io/almalinux/almalinux:9-init
    pre_build_image: true
    privileged: true
    command: /sbin/init

  - name: rocky-10
    image: quay.io/centos-bootc/centos-bootc:stream10
    pre_build_image: true
    privileged: true
    command: /sbin/init

  - name: oracle-10
    image: container-registry.oracle.com/os/oraclelinux:9
    pre_build_image: true
    privileged: true
    command: /sbin/init

  - name: opensuse
    image: registry.opensuse.org/opensuse/tumbleweed:latest
    pre_build_image: true
    privileged: true

  - name: opensuse-leap
    image: registry.opensuse.org/opensuse/leap:latest
    pre_build_image: true
    privileged: true

provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml

scenario:
  name: smoke
  test_sequence:
    - dependency
    - destroy
    - create
    - prepare
    - verify

verifier:
  name: ansible
