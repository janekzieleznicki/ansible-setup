- name: Verify full
  hosts: all
  gather_facts: true
  vars:
    package_sets:
      RedHat:
      - zsh
      - acl
      - git
      - curl
      - gcc
      - gcc-c++
      - cmake
      - golang
      - nodejs
      - python3
      - python3-pip
      - python3-setuptools
      - python3-devel
      - unzip
      - fontconfig-devel
      Suse:
      - zsh
      - acl
      - git
      - curl
      - gcc
      - gcc-c++
      - cmake
      - golang
      - nodejs
      - python3
      - python3-pip
      - python3-devel
      - unzip
      - fontconfig-devel
      Debian:
      - zsh
      - acl
      - git
      - curl
      - cmake
      - libfontconfig-dev
      - nodejs
      - python3
      - python3-pip
      - python3-setuptools
      - unzip
      - golang-go
    extra_packages:
      Fedora:
      - python3-neovim
      RedHat:
      - epel-release
    expected_packages: '{{ package_sets[ansible_facts[''os_family'']] | default([])
      + extra_packages[ansible_facts[''distribution'']] | default([]) }}'
    artifact_paths:
    - /home/root/.local/bin/nvim
    - /home/root/.config/alacritty/icon.svg
    - /home/root/.dotfiles
  tasks:
  - name: Check package installation
    register: pkg_check
    changed_when: false
    failed_when: false
    loop: '{{ expected_packages }}'
    ansible.builtin.shell: '{% if ansible_facts.pkg_mgr in [''dnf'', ''yum'', ''dnf5'']
      %}

      rpm -q --whatprovides {{ item }}

      {% elif ansible_facts.pkg_mgr == ''apt'' %}

      dpkg -s {{ item }}

      {% elif ansible_facts.pkg_mgr == ''zypper'' %}

      rpm -q --whatprovides {{ item }}

      {% else %}

      echo ''Unsupported pkg_mgr: {{ ansible_facts.pkg_mgr }}''; exit 1

      {% endif %}'
  - name: Assert packages were installed by the role
    ansible.builtin.assert:
      that:
      - item.rc == 0
    loop: '{{ pkg_check.results }}'
  - name: Check installed artifacts exist
    ansible.builtin.stat:
      path: '{{ item }}'
    register: artifacts
    loop: '{{ artifact_paths }}'
  - name: Assert artifacts are present
    ansible.builtin.assert:
      that:
      - item.stat.exists
    loop: '{{ artifacts.results }}'
  - name: Assert nvim is executable
    ansible.builtin.assert:
      that:
      - artifacts.results[0].stat.exists
  - block:
    - name: Find installed nerd fonts
      ansible.builtin.find:
        paths: /home/root/.local/share/fonts
        patterns: '*Nerd*Font*Complete*'
      register: fonts
    - name: Assert Hack and JetBrainsMono nerd fonts are installed
      ansible.builtin.assert:
        that:
        - fonts.matched > 0
        - '''Hack'' in (fonts.files | map(attribute=''path'') | map(''basename'')
          | join('' ''))'
        - '''JetBrains'' in (fonts.files | map(attribute=''path'') | map(''basename'')
          | join('' ''))'
    when: ansible_distribution != "Fedora"
  - name: Check root login shell
    ansible.builtin.command: getent passwd root
    register: root_passwd
    changed_when: false
  - name: Assert root shell is zsh
    ansible.builtin.assert:
      that:
      - '''/bin/zsh'' in root_passwd.stdout'
