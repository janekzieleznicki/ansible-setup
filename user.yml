---
- hosts: all
  become: yes
  vars:
    users:
      - name: vagrant
        groups: [docker, libvirt]
  
  tasks:
  - name: Create groups
    ansible.builtin.group:
      name: "{{ item.1 }}"
      state: present
    loop: "{{ users | subelements('groups') | list | unique }}"

  - name: Create user {{ item.name }}
    ansible.builtin.user:
      name: "{{ item.name }}"
      password: '$6$9qyKGP0H9LyMnePI$YPOGp8J9KpRWYJhIMwl3lKlkXLW/ClliQ1dg8mXHGI8o2Y8b.OpbQC5xJxqJRF/2ARcNFZCjJgepmc9NAZB0T.' #vagrant
      groups: "{{ item.groups }}"   # Empty by default.
      shell: /bin/zsh
      state: present
      append: yes
    with_items: "{{ users }}"

  - name: Add user to wheel group on RedHat
    ansible.builtin.user:
      name: "{{ item.name  }}"
      groups: wheel
      state: present
      append: yes
    with_items: "{{ users }}"
    when: ansible_facts['os_family'] == "RedHat"

  - name: Add user to sudo group on Debian
    ansible.builtin.user:
      name: "{{ item.name  }}"
      groups: sudo
      state: present
      append: yes
    with_items: "{{ users }}"
    when: ansible_facts['os_family'] == "Debian"

  - name: Placing key {{ item.name  }}
    ansible.builtin.authorized_key:
      user: "{{ item.name  }}"
      state: present
      key: "{{ lookup('file', '~/.ssh/id_ed25519.pub') }}"
    with_items: "{{ users }}"
