- name: Bootstrap | Fix DNF repo for Fedora
  ansible.builtin.raw: "/bin/sh -c '\n  if command -v dnf >/dev/null 2>&1; then\n\
    \    if grep -q \"^ID=fedora\" /etc/os-release; then\n      # Prepend IPv4 nameservers\
    \ so DNS resolution works in slirp4netns networks\n      # (prepend, not overwrite,\
    \ so existing nameservers are still used)\n      cp /etc/resolv.conf /tmp/resolv.conf\n\
    \      printf \"nameserver 8.8.8.8\\n\" > /etc/resolv.conf\n      printf \"nameserver\
    \ 8.8.4.4\\n\" >> /etc/resolv.conf\n      cat /tmp/resolv.conf >> /etc/resolv.conf\n\
    \      rm /tmp/resolv.conf\n      # nsswitch.conf uses resolve module which queries\
    \ systemd-resolved stub (127.0.0.53),\n      # bypassing resolv.conf entirely.\
    \ Replace resolve with dns so glibc uses resolv.conf.\n      awk \"/^hosts:/ {\
    \ print \\\"hosts:      files dns\\\"; next } { print }\" /etc/nsswitch.conf >\
    \ /etc/nsswitch.conf.tmp && mv /etc/nsswitch.conf.tmp /etc/nsswitch.conf\n   \
    \   # Force dnf/curl to use IPv4 only; slirp4netns blocks IPv6\n      mkdir -p\
    \ /etc/dnf/dnf.conf.d\n      printf \"ip_resolve=ipv4\\n\" > /etc/dnf/dnf.conf.d/fedora-ipv4.conf\n\
    \      printf \"check_root_gpgkey=false\\n\" >> /etc/dnf/dnf.conf.d/fedora-ipv4.conf\n\
    \      # Set releasever so dnf uses the bundled repos without hitting the network\n\
    \      . /etc/os-release\n      mkdir -p /etc/yum/vars\n      echo \"$VERSION_ID\"\
    \ > /etc/yum/vars/releasever\n      dnf -y install fedora-release || {\n     \
    \   echo \"Failed to install fedora-release\"\n        exit 1\n      }\n     \
    \ . /etc/os-release\n      mkdir -p /etc/yum/vars\n      echo \"$VERSION_ID\"\
    \ > /etc/yum/vars/releasever\n      dnf -y reinstall fedora-repos || {\n     \
    \   echo \"Failed to reinstall fedora-repos\"\n        exit 1\n      }\n     \
    \ dnf -y clean all || true\n      dnf -y --releasever=$VERSION_ID makecache ||\
    \ {\n        echo \"Failed to makecache with releasever\"\n        exit 1\n  \
    \    }\n    fi\n  fi\n'\n"
  become: false
  changed_when: false
  timeout: 1200
- name: Bootstrap | Install python3 via zypper (SUSE family)
  ansible.builtin.raw: "/bin/sh -c '\n  if command -v zypper >/dev/null 2>&1; then\n\
    \    zypper --non-interactive install -y python3\n  fi\n'"
  become: false
  changed_when: false
  timeout: 300
- name: Bootstrap | Install python3 via apt (Debian family)
  ansible.builtin.raw: "/bin/sh -c '\n  if command -v apt >/dev/null 2>&1; then\n\
    \    export DEBIAN_FRONTEND=noninteractive\n    apt-get update -qq\n    apt-get\
    \ install -y -qq python3\n  fi\n'"
  become: false
  changed_when: false
  timeout: 300
