---
- name: Load terraform packages redhat variable file
  include_vars: packages_redhat.yml

- name: Load terraform packages debian variable file
  include_vars: packages_debian.yml

- name: Install dnf plugins core (for config-manager)
  dnf:
    name: dnf-plugins-core
    state: present
  when: ansible_facts['os_family'] == "RedHat"

- name: Enable CRB / Powertools repository for devel packages (Alma/Rocky)
  ansible.builtin.command: "dnf config-manager --set-enabled {{ 'crb' if ansible_distribution_major_version | int >= 9 else 'powertools' }}"
  when: ansible_distribution in ['AlmaLinux', 'Rocky']
  changed_when: false
  ignore_errors: true

- name: Enable CodeReady Builder on Oracle Linux
  ansible.builtin.command: "dnf config-manager --set-enabled ol{{ ansible_distribution_major_version }}_codeready_builder"
  when: ansible_distribution == "OracleLinux"
  changed_when: false
  ignore_errors: true

- name: Enable CodeReady Builder on RHEL
  ansible.builtin.command: "subscription-manager repos --enable codeready-builder-for-rhel-{{ ansible_distribution_major_version }}-{{ ansible_architecture }}-rpms"
  when: ansible_distribution == "RedHat"
  changed_when: false
  ignore_errors: true

- name: Install @virtualization group on RedHats
  dnf:
    name: "{{ packages_redhat }}"
    state: present
    allowerasing: true
  when: ansible_facts['os_family'] == "RedHat"
  ignore_errors: yes

- name: Install deps on Debians
  apt:
    name: "{{ packages_debian }}"
    state: present
    update_cache: yes
  when: ansible_facts['os_family'] == 'Debian'

- name: Enable source repos on Debains
  replace:
    path: /etc/apt/sources.list
    regexp: '# deb-src '
    replace: 'deb-src '
  when: ansible_facts['os_family'] == 'Debian'