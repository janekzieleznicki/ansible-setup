---
- name: Load cargo packages variable file
  ansible.builtin.include_vars: cargo_packages.yml

- name: Update Rust toolchain
  ansible.builtin.command:
    argv: ["{{ user_home }}/.cargo/bin/rustup", "update"]
  changed_when: "'unchanged' not in rustup_update.stdout"
  become: true
  become_user: "{{ zsh_user }}"
  timeout: 900
  register: rustup_update
  retries: 3
  delay: 10
  until: rustup_update.rc == 0

- name: Refresh crates.io index cache
  ansible.builtin.file:
    path: "{{ user_home }}/.cargo/registry/index"
    state: absent
  become: true
  become_user: "{{ zsh_user }}"
  changed_when: false
- name: Cargo Install
  ansible.builtin.command:
    argv: ["{{ user_home }}/.cargo/bin/cargo", "install", "{{ item.crate }}"]
  creates: "{{ user_home }}/.cargo/bin/{{ item.bin }}"
  environment:
    RUSTFLAGS: "-C target-cpu=native"
  become: true
  become_user: "{{ zsh_user }}"
  loop: "{{ cargo_packages }}"
  loop_control:
    label: "{{ item.crate }}"
  register: cargo_install
  retries: 3
  delay: 15
  until: cargo_install.rc == 0
