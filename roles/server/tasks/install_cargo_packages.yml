---
- name: Load cargo packages variable file
  include_vars: cargo_packages.yml

- name: Update Rust toolchain
  command: ~/.cargo/bin/rustup update
  become: true
  become_user: "{{ zsh_user }}"
  timeout: 900
  register: rustup_update
  retries: 3
  delay: 10
  until: rustup_update.rc == 0

- name: Refresh crates.io index cache
  ansible.builtin.shell: rm -rf ~/.cargo/registry/index
  become: true
  become_user: "{{ zsh_user }}"
  changed_when: false

- name: Cargo Install
  command: ~/.cargo/bin/cargo install {{ item }}
  environment:
    RUSTFLAGS: "-C target-cpu=native"
  become: true
  become_user: "{{ zsh_user }}"
  loop: "{{ cargo_packages }}"
  loop_control:
    label: "{{ item }}"
  register: cargo_install
  retries: 3
  delay: 15
  until: cargo_install.rc == 0
