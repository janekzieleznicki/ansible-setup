---
- name: Load server packages rpm variable file
  include_vars: packages_rpm.yml

- name: Load server packages apt variable file
  include_vars: packages_apt.yml

- name: Load server neovim variable file
  include_vars: neovim.yml

- name: Load server fonts variable file
  include_vars: fonts.yml

- name: Load server packages suse variable file
  include_vars: packages_suse.yml

- name: Load server packages brew variable file
  include_vars: packages_brew.yml

- name: Distro debug
  ansible.builtin.debug:
    msg: "Detected os_family: {{ ansible_os_family | default('unknown') }} and distribution: {{ ansible_distribution | default('unknown') }} version: {{ ansible_distribution_major_version | default('unknown') }}"

- name: Clean dnf lock files
  ansible.builtin.raw: |
    rm -f /var/run/dnf.pid /var/lib/dnf/lock
  ignore_errors: yes

- name: Update DNF cache
  ansible.builtin.command: dnf makecache
  ignore_errors: yes
  when: ansible_os_family == "RedHat"

- name: Install dnf-plugins-core for RedHat family
  ansible.builtin.raw: |
    /bin/sh -c '
      if command -v dnf >/dev/null 2>&1; then
        timeout 120 dnf -y install dnf-plugins-core || {
          echo "Failed to install dnf-plugins-core"
          exit 1
        }
      else
        echo "dnf not found, skipping"
        exit 0
      fi
    '
  ignore_errors: yes
  when: ansible_os_family == "RedHat"
  timeout: 120

- name: Install RPM packages (RedHat family) - chunk 1
  ansible.builtin.dnf:
    name:
      - zsh
      - acl
      - git
      - curl
      - gcc
    state: present
  ignore_errors: yes
  when: ansible_os_family == "RedHat"
  timeout: 600

- name: Install RPM packages (RedHat family) - chunk 2
  ansible.builtin.dnf:
    name:
      - gcc-c++
      - cmake
      - golang
    state: present
  ignore_errors: yes
  when: ansible_os_family == "RedHat"
  timeout: 600

- name: Install nodejs for RedHat family
  ansible.builtin.dnf:
    name: nodejs
    state: present
  ignore_errors: yes
  when: ansible_os_family == "RedHat"
  timeout: 600

- name: Install RPM packages (RedHat family) - chunk 3
  ansible.builtin.dnf:
    name:
      - python3
      - python3-pip
      - python3-setuptools
      - python3-devel
    state: present
  ignore_errors: yes
  when: ansible_os_family == "RedHat"
  timeout: 600

- name: Install RPM packages (RedHat family) - chunk 4
  ansible.builtin.dnf:
    name:
      - unzip
    state: present
  ignore_errors: yes
  when: ansible_os_family == "RedHat"
  timeout: 600

- name: Install X11/xcb build deps for cargo alacritty (RedHat family)
  ansible.builtin.dnf:
    name:
      - freetype-devel
      - fontconfig-devel
      - libxcb-devel
      - libxkbcommon-devel
      - libX11-devel
      - libXcursor-devel
      - libXrandr-devel
      - libXi-devel
    state: present
  ignore_errors: yes
  when: ansible_os_family == "RedHat"
  timeout: 600

- name: Install X11/xcb build deps for cargo alacritty (Suse family)
  ansible.builtin.zypper:
    name:
      - freetype2-devel
      - fontconfig-devel
      - libxcb-devel
      - libxkbcommon-devel
      - libX11-devel
      - libXcursor-devel
      - libXrandr-devel
      - libXi-devel
    state: present
  when: ansible_os_family == "Suse"
  timeout: 600

- name: Install go for Fedora
  ansible.builtin.raw: |
    /bin/sh -c '
      if command -v dnf >/dev/null 2>&1; then
        if rpm -q golang >/dev/null 2>&1; then
          echo "golang is already installed"
          exit 0
        fi
        timeout 1800 dnf -y install golang --setopt=install_weak_deps=false || {
          echo "Failed to install golang, trying with --best --allowerasing"
          timeout 1800 dnf -y install --best --allowerasing golang --setopt=install_weak_deps=false
        }
      else
        echo "dnf not found, skipping"
        exit 0
      fi
    '
  become: no
  changed_when: false
  when: ansible_distribution == "Fedora"

- name: Enable CRB / Powertools repository for devel packages
  block:
    - name: Enable CodeReady Builder on Red Hat Enterprise Linux
      ansible.builtin.command: subscription-manager repos --enable "codeready-builder-for-rhel-{{ ansible_distribution_major_version }}-{{ ansible_architecture }}-rpms"
      when: ansible_distribution == "RedHat"
      register: rhel_crb
      changed_when: "'enabled' in rhel_crb.stdout"
      timeout: 120

    - name: Enable CodeReady Builder on Oracle Linux
      ansible.builtin.command: dnf config-manager --set-enabled "ol{{ ansible_distribution_major_version }}_codeready_builder"
      when: ansible_distribution == "OracleLinux"
      register: oracle_crb
      changed_when: oracle_crb.rc == 0
      timeout: 120

    - name: Enable CRB / Powertools on CentOS, Rocky, or AlmaLinux
      ansible.builtin.command: "dnf config-manager --set-enabled {{ 'crb' if ansible_distribution_major_version | int >= 9 else 'powertools' }}"
      when: ansible_distribution in ["CentOS", "Rocky", "AlmaLinux"]
      register: clone_crb
      changed_when: clone_crb.rc == 0
      timeout: 120
  when: ansible_os_family == "RedHat" and ansible_distribution != "Fedora"

- name: Install EPEL repository for RHEL derivatives (skip Fedora and OracleLinux)
  ansible.builtin.dnf:
    name: epel-release
    state: present
    disable_gpg_check: yes
  when:
    - ansible_os_family == "RedHat"
    - ansible_distribution not in ["Fedora", "Fedora Linux", "OracleLinux", "OracleLinuxServer"]

- name: Install python3-neovim for RedHat family (after EPEL)
  ansible.builtin.dnf:
    name: python3-neovim
    state: present
  ignore_errors: yes
  when: ansible_os_family == "RedHat"
  timeout: 300

- name: Install apt-utils for Debian family
  ansible.builtin.apt:
    name: apt-utils
    state: present
    update_cache: yes
  when: ansible_os_family == "Debian"

- name: Install packages apt
  ansible.builtin.apt:
    name: "{{ packages_apt }}"
    state: present
    update_cache: yes
  when: ansible_os_family == "Debian"

- name: Install neovim python package
  ansible.builtin.pip:
    name: "{{ neovim_pip_package }}"
    executable: pip3
  when: ansible_facts['distribution'] == "CentOS"

- name: Ensure bin directory exists for zsh_user
  ansible.builtin.file:
    path: "{{ user_home }}/.local/bin"
    state: directory
  become: no
  become_user: "{{ zsh_user }}"

- name: Ensure nvim opt directory exists for zsh_user
  ansible.builtin.file:
    path: "{{ user_home }}/.local/opt/nvim"
    state: directory
  become: no
  when: (ansible_facts['os_family'] | default('')) != 'Darwin'

- name: Download neovim tarball
  ansible.builtin.get_url:
    url: "{{ neovim_tarball_url }}"
    dest: "{{ user_home }}/.local/opt/{{ neovim_arch }}.tar.gz"
    mode: "0644"
    force: no
  ignore_errors: yes
  become: no
  timeout: 600
  register: nvim_download
  when: (ansible_facts['os_family'] | default('')) != 'Darwin'

- name: Extract neovim tarball
  ansible.builtin.unarchive:
    src: "{{ user_home }}/.local/opt/{{ neovim_arch }}.tar.gz"
    dest: "{{ user_home }}/.local/opt/nvim"
    remote_src: yes
    extra_opts:
      - --strip-components=1
    creates: "{{ user_home }}/.local/opt/nvim/bin/nvim"
  become: no
  timeout: 600
  when:
    - (ansible_facts['os_family'] | default('')) != 'Darwin'
    - nvim_download is success

- name: Link nvim into user bin
  ansible.builtin.file:
    src: "{{ user_home }}/.local/opt/nvim/bin/nvim"
    dest: "{{ user_home }}/.local/bin/nvim"
    state: link
    force: yes
  become: no
  when:
    - (ansible_facts['os_family'] | default('')) != 'Darwin'
    - nvim_download is success

- name: Remove obsolete neovim appimage
  ansible.builtin.file:
    path: "{{ user_home }}/.local/bin/nvim.appimage"
    state: absent
  become: no
  when: (ansible_facts['os_family'] | default('')) != 'Darwin'

- name: Install fonts
  include_role:
    name: nerd-font
  vars:
    font: "{{ item }}"
  ignore_errors: yes
  loop: "{{ fonts }}"
  when: ansible_distribution != "Fedora"

- name: Install packages suse
  ansible.builtin.zypper:
    name: "{{ packages_suse }}"
    state: present
  when: ansible_os_family == "Suse"

- name: Ensure Homebrew is installed (macOS)
  ansible.builtin.shell: |
    if ! command -v brew >/dev/null 2>&1 && [ ! -x /opt/homebrew/bin/brew ] && [ ! -x /usr/local/bin/brew ]; then
      NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
    fi
  become: false
  changed_when: false
  when: (ansible_facts['os_family'] | default('')) == 'Darwin'
  timeout: 1800

- name: Install brew packages (macOS)
  community.general.homebrew:
    name: "{{ packages_brew }}"
    state: present
    update_homebrew: true
  become: false
  when: (ansible_facts['os_family'] | default('')) == 'Darwin'
  timeout: 3600