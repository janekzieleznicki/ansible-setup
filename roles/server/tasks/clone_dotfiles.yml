---
- name: dotfiles git clone for {{ zsh_user }} using ssh
  ansible.builtin.git:
    repo: git@github.com:janekzieleznicki/dotfiles.git
    dest: "{{ user_home }}/.dotfiles"
    force: yes
    version: "{{ dotfiles_version }}"
    accept_hostkey: yes
    depth: 1
  environment:
    GIT_HTTP_LOW_SPEED_LIMIT: 1000
    GIT_HTTP_LOW_SPEED_TIME: 30
  become: true
  become_user: "{{ zsh_user }}"
  register: ssh_github
  failed_when: false
  vars:
    allow_world_readable_tmpfiles: true

- name: Fallback to dotfiles git clone for {{ zsh_user }} using https
  when: ssh_github is failed
  ansible.builtin.git:
    repo: https://github.com/janekzieleznicki/dotfiles.git
    dest: "{{ user_home }}/.dotfiles"
    force: yes
    version: "{{ dotfiles_version }}"
  become: true
  become_user: "{{ zsh_user }}"
  # Removed ignore_errors
  vars:
    allow_world_readable_tmpfiles: true

- name: Create ~/.config/alacritty directory
  ansible.builtin.file:
    path: ~/.config/alacritty
    state: directory
  become: true
  become_user: "{{ zsh_user }}"

- name: dotfiles install for {{ zsh_user }}
  ansible.builtin.command:
    argv: ["{{ user_home }}/.dotfiles/install"]
  creates: "{{ user_home }}/.zshrc"
  timeout: 3600
  become: true
  become_user: "{{ zsh_user }}"

- name: change user shell to zsh
  become: true
  ansible.builtin.user:
    name: "{{ zsh_user }}"
    shell: /bin/zsh

- name: Download rustup script
  ansible.builtin.get_url:
    url: https://sh.rustup.rs
    dest: /tmp/rustup.sh
    mode: '0755'
  become: true
  become_user: "{{ zsh_user }}"

- name: Run rustup installer
  ansible.builtin.command:
    argv: ["/tmp/rustup.sh", "-y", "--no-modify-path"]
  creates: "{{ user_home }}/.cargo/bin/rustup"
  timeout: 600
  become: true
  become_user: "{{ zsh_user }}"

- name: Install lazygit via go
  ansible.builtin.raw: |
    /bin/sh -c '
      if command -v go >/dev/null 2>&1; then
        timeout 300 go install github.com/jesseduffield/lazygit@latest || {
          echo "Failed to install lazygit via go"
          exit 1
        }
      else
        echo "go not found, skipping"
        exit 0
      fi
    '
  changed_when: false
  failed_when: false
  become: true
  become_user: "{{ zsh_user }}"

- name: Create ~/.local/share/applications directory
  file:
    path: ~/.local/share/applications
    state: directory
  become: true
  become_user: "{{ zsh_user }}"
  when: (ansible_facts['os_family'] | default('')) != 'Darwin'

- name: Create alacritty desktop entry
  ansible.builtin.template:
    src: alacritty.desktop
    dest: ~/.local/share/applications/alacritty.desktop
  failed_when: false
  become: true
  become_user: "{{ zsh_user }}"
  when: (ansible_facts['os_family'] | default('')) != 'Darwin'

- name: Copy alacritty icon
  ansible.builtin.template:
    src: alacritty.icon.svg
    dest: ~/.config/alacritty/icon.svg
  failed_when: false
  become: true
  when: (ansible_facts['os_family'] | default('')) != 'Darwin'
  become_user: "{{ zsh_user }}"
